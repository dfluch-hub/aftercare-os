function resetForm(){['medName','medDetail','careName','careDetail','apptName','apptLocation','apptPrep'].forEach(id=>$(id).value='');$('itemTime').value='';$('itemDate').value=dayDate();document.querySelectorAll('.timeChip').forEach(b=>b.classList.remove('active'));$('suggestions').classList.add('hidden')}function openAdd(){mode='add';editId=null;currentType=null;resetForm();$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('choiceHead').classList.remove('hidden');$('formHead').classList.add('hidden');$('sheetTitle').textContent=t('whatAdd');openModal()}function selectType(v){currentType=v;$('typeStep').classList.add('hidden');$('itemForm').classList.remove('hidden');$('itemActions').classList.remove('hidden');$('choiceHead').classList.add('hidden');$('formHead').classList.remove('hidden');$('formTitle').textContent=v==='med'?t(mode==='edit'?'editMed':'addMed'):v==='care'?t(mode==='edit'?'editCare':'addCare'):t(mode==='edit'?'editAppt':'addAppt');['med','care','appt'].forEach(x=>$(x+'Fields').classList.toggle('hidden',x!==v))}function openEdit(id){const i=state.items.find(x=>x.id===id);if(!i)return;mode='edit';editId=id;resetForm();selectType(i.type);$('itemDate').value=i.date;$('itemTime').value=i.time;if(i.type==='med'){$('medName').value=i.name;$('medDetail').value=i.detail||''}else if(i.type==='care'){$('careName').value=i.name;$('careDetail').value=i.detail||''}else{$('apptName').value=i.name;$('apptLocation').value=i.location||'';$('apptPrep').value=i.prep||''}openModal()}function readForm(){const time=$('itemTime').value,date=$('itemDate').value;if(!time||!date)return null;if(currentType==='med')return{type:'med',name:$('medName').value.trim(),detail:$('medDetail').value.trim(),time,date};if(currentType==='care')return{type:'care',name:$('careName').value.trim(),detail:$('careDetail').value.trim(),time,date};return{type:'appt',name:$('apptName').value.trim(),location:$('apptLocation').value.trim(),prep:$('apptPrep').value.trim(),time,date}}function persist(closeAfter){const data=readForm();if(!data||!data.name){alert(t('formError'));return}if(mode==='edit'){const idx=state.items.findIndex(x=>x.id===editId);state.items[idx]={...state.items[idx],...data}}else state.items.push({id:uid(),done:false,...data});save();render();if(closeAfter)closeModal();else{const ty=currentType;resetForm();selectType(ty)}}
$('getStarted').onclick=()=>{welcomePassed=true;render()};document.querySelectorAll('.langBtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(LANG_KEY,lang);render()});document.querySelectorAll('.proc').forEach(b=>b.onclick=()=>{selectedProc=b.dataset.proc;document.querySelectorAll('.proc').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-checked',String(on))})});$('setupForm').onsubmit=e=>{e.preventDefault();user={name:$('pname').value.trim(),procedure:selectedProc,procedureDate:$('pdate').value,phone:$('pphone').value.trim()};localStorage.setItem(USER_KEY,JSON.stringify(user));state=defaultState();save();render()};document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('addBtn').onclick=openAdd;document.querySelectorAll('[data-close="item"]').forEach(x=>x.onclick=closeModal);document.querySelectorAll('.typeTile').forEach(b=>b.onclick=()=>selectType(b.dataset.type));$('backBtn').onclick=()=>{currentType=null;$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('choiceHead').classList.remove('hidden');$('formHead').classList.add('hidden')};document.querySelectorAll('.timeChip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.timeChip').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('itemTime').value=b.dataset.time});$('itemTime').oninput=()=>document.querySelectorAll('.timeChip').forEach(x=>x.classList.toggle('active',x.dataset.time===$('itemTime').value));$('medName').onfocus=()=>$('medName').dispatchEvent(new Event('input'));$('medName').oninput=()=>{const q=$('medName').value.trim().toLowerCase(),matches=meds.filter(m=>!q||m.name.toLowerCase().includes(q)).slice(0,7);$('suggestions').classList.toggle('hidden',!matches.length);$('suggestions').innerHTML=matches.map((m,i)=>`<button type="button" class="suggestion" data-i="${i}"><strong>${esc(m.name)}</strong><span>${lang==='de'?'Aus Katalog übernehmen':'Use from catalog'}</span></button>`).join('');$('suggestions').querySelectorAll('.suggestion').forEach((b,i)=>b.onclick=()=>{$('medName').value=matches[i].name;$('suggestions').classList.add('hidden')})};$('saveAnother').onclick=e=>{e.preventDefault();persist(false)};$('doneSave').onclick=e=>{e.preventDefault();persist(true)};$('editProfileBtn').onclick=()=>{$('profileForm').classList.toggle('hidden');$('editName').value=user.name;$('editDate').value=user.procedureDate||''};$('cancelProfile').onclick=()=>$('profileForm').classList.add('hidden');$('saveProfile').onclick=()=>{user.name=$('editName').value.trim()||user.name;user.procedureDate=$('editDate').value||user.procedureDate;localStorage.setItem(USER_KEY,JSON.stringify(user));$('profileForm').classList.add('hidden');render()};$('resetBtn').onclick=()=>{if(confirm(t('reset')+'?')){localStorage.removeItem(USER_KEY);localStorage.removeItem(STATE_KEY);user=null;state=null;welcomePassed=false;render()}};if(!state&&user){state=defaultState();save()}render();
</script>
