function resetForm(){['medName','medDetail','careName','careDetail','apptName','apptLocation','apptPrep'].forEach(id=>$(id).value='');$('itemTime').value='';$('itemDate').value=dayDate();document.querySelectorAll('.timeChip').forEach(b=>b.classList.remove('active'));$('suggestions').classList.add('hidden')}function openAdd(){mode='add';editId=null;currentType=null;resetForm();$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('backBtn').classList.add('hidden');$('sheetTitle').textContent=t('whatAdd');openModal('itemModal')}function selectType(v){currentType=v;$('typeStep').classList.add('hidden');$('itemForm').classList.remove('hidden');$('itemActions').classList.remove('hidden');$('backBtn').classList.toggle('hidden',mode==='edit');$('sheetTitle').textContent=sheetTitleFor(currentType,mode==='edit');['med','care','appt'].forEach(x=>$(x+'Fields').classList.toggle('hidden',x!==currentType))}function openEdit(id){const i=state.items.find(x=>x.id===id);if(!i)return;mode='edit';editId=id;resetForm();selectType(normalizeType(i));$('itemDate').value=i.date;$('itemTime').value=i.time;if(currentType==='med'){$('medName').value=i.name||'';$('medDetail').value=i.detail||''}else if(currentType==='care'){$('careName').value=i.name||'';$('careDetail').value=i.detail||''}else{$('apptName').value=i.name||'';$('apptLocation').value=i.location||'';$('apptPrep').value=i.prep||''}openModal('itemModal')}function readForm(){const time=$('itemTime').value,date=$('itemDate').value;if(!time||!date)return null;if(currentType==='med'){const name=$('medName').value.trim();if(!name)return null;return{type:'med',name,detail:$('medDetail').value.trim(),time,date}}if(currentType==='care'){const name=$('careName').value.trim();if(!name)return null;return{type:'care',name,detail:$('careDetail').value.trim(),time,date}}const name=$('apptName').value.trim();if(!name)return null;return{type:'appt',name,location:$('apptLocation').value.trim(),prep:$('apptPrep').value.trim(),time,date}}function persist(closeAfter){const data=readForm();if(!data){alert(t('formError'));return false}if(mode==='edit'){const idx=state.items.findIndex(x=>x.id===editId);state.items[idx]={...state.items[idx],...data};save();render();if(closeAfter)closeModal('itemModal');return true}state.items.push({id:uid(),done:false,...data});save();render();if(closeAfter)closeModal('itemModal');else{const type=currentType;resetForm();selectType(type)}return true}
$('getStarted').onclick=()=>{welcomePassed=true;render()};document.querySelectorAll('.langBtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(LANG_KEY,lang);render()});document.querySelectorAll('.proc').forEach(b=>b.onclick=()=>{selectedProc=b.dataset.proc;document.querySelectorAll('.proc').forEach(x=>x.classList.toggle('active',x===b))});$('setupForm').onsubmit=e=>{e.preventDefault();user={name:$('pname').value.trim(),procedure:selectedProc,procedureLabel:t(selectedProc),procedureDate:$('pdate').value,phone:$('pphone').value.trim()};localStorage.setItem(USER_KEY,JSON.stringify(user));state=defaultState();save();render()};document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('addBtn').onclick=openAdd;$('settingsBtn').onclick=()=>openModal('settingsModal');document.querySelectorAll('[data-close="item"]').forEach(x=>x.onclick=()=>closeModal('itemModal'));document.querySelectorAll('[data-close="settings"]').forEach(x=>x.onclick=()=>closeModal('settingsModal'));document.querySelectorAll('.typeTile').forEach(b=>b.onclick=()=>selectType(b.dataset.type));$('backBtn').onclick=()=>{currentType=null;$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('backBtn').classList.add('hidden');$('sheetTitle').textContent=t('whatAdd')};document.querySelectorAll('.timeChip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.timeChip').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('itemTime').value=b.dataset.time});$('itemTime').oninput=()=>document.querySelectorAll('.timeChip').forEach(x=>x.classList.toggle('active',x.dataset.time===$('itemTime').value));$('medName').oninput=()=>{const q=$('medName').value.trim().toLowerCase(),matches=medSuggestions.filter(m=>m.name.toLowerCase().includes(q));if(!q||!matches.length){$('suggestions').classList.add('hidden');return}$('suggestions').innerHTML=matches.map((m,i)=>`<button type="button" class="suggestion" data-i="${i}"><strong>${esc(m.name)}</strong><span>${esc(m.detail)}</span></button>`).join('');$('suggestions').classList.remove('hidden');$('suggestions').querySelectorAll('.suggestion').forEach((b,i)=>b.onclick=()=>{$('medName').value=matches[i].name;$('medDetail').value=matches[i].detail;$('suggestions').classList.add('hidden')})};$('saveAnother').onclick=e=>{e.preventDefault();persist(false)};$('doneSave').onclick=e=>{e.preventDefault();persist(true)};$('resetBtn').onclick=()=>{if(confirm(t('reset')+'?')){localStorage.removeItem(USER_KEY);localStorage.removeItem(STATE_KEY);user=null;state=null;welcomePassed=false;closeModal('settingsModal');render()}};if(!state&&user){state=defaultState();save()}render();
</script>
