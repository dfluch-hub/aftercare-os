function applyLang(){document.documentElement.lang=lang;document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const m={welcomeTitle:'welcomeTitle',welcomeSub:'welcomeSub',hl1:'hl1',hl2:'hl2',hl3:'hl3',getStarted:'getStarted',setupTitle:'setupTitle',setupSub:'setupSub',nameLabel:'name',procedureLabel:'procedure',dateLabel:'date',phoneLabel:'phone',startBtn:'start',todayToggle:'today',tomorrowToggle:'tomorrow',completedTitle:'completed',todayEmpty:'todayEmpty',medsTitle:'meds',medsSub:'medsSub',medEmpty:'medEmpty',careTitle:'care',careSub:'careSub',careEmpty:'careEmpty',redTitle:'red',redSub:'redSub',redText:'redText',call911:'call911',settingsTitle:'settings',addBtn:'add',navToday:'today',navMeds:'meds',navCare:'care',navRed:'red',typeMedTitle:'medType',typeMedSub:'medTypeSub',typeCareTitle:'careType',typeCareSub:'careTypeSub',typeApptTitle:'apptType',typeApptSub:'apptTypeSub',medNameLabel:'medName',medDetailLabel:'medDetail',careNameLabel:'careName',careDetailLabel:'careDetail',apptNameLabel:'apptName',apptLocationLabel:'apptLocation',apptPrepLabel:'apptPrep',quickTimeLabel:'quickTime',customTimeLabel:'customTime',itemDateLabel:'itemDate',saveAnother:'saveAnother',doneSave:'done',patientSectionTitle:'patientData',prefsTitle:'preferences',dangerTitle:'dangerZone',languageLabel:'language',editProfileBtn:'editProfile',cancelProfile:'cancel',saveProfile:'save',resetBtn:'reset',meNameLabel:'name',meProcedureLabel:'procedure',meDateLabel:'date',catalogHint:'catalog',updateBanner:'updateAvailable'};Object.entries(m).forEach(([id,k])=>{if($(id))$(id).textContent=t(k)});document.querySelectorAll('.proc').forEach(b=>{const label=b.querySelector('.procText');if(label)label.textContent=t(b.dataset.proc)});$('call911').href=lang==='de'?'tel:112':'tel:911';$('pname').placeholder=lang==='de'?'Dein Name':'Your name';$('pphone').placeholder=lang==='de'?'Optional – z. B. Klinik oder Praxis':'Optional – clinic or practice';$('medName').placeholder=lang==='de'?'Medikament suchen oder eingeben':'Search or enter medication';$('medDetail').placeholder=lang==='de'?'z. B. 1 Tablette':'e.g. 1 tablet';$('careName').placeholder=lang==='de'?'z. B. Kühlpack':'e.g. Ice pack';$('careDetail').placeholder=lang==='de'?'z. B. 20 Min kühlen':'e.g. 20 min cooling';$('apptName').placeholder=lang==='de'?'z. B. Dr. Müller':'e.g. Dr. Miller';$('apptLocation').placeholder=lang==='de'?'z. B. Orthopädie, Zimmer 4':'e.g. Orthopedics, Room 4';$('apptPrep').placeholder='Optional';$('typeMedIcon').innerHTML=icons.med;$('typeCareIcon').innerHTML=icons.care;$('typeApptIcon').innerHTML=icons.appt;$('medIcon').innerHTML=icons.med;$('noteIcon1').innerHTML=icons.note;$('careInputIcon').innerHTML=icons.care;$('careNoteIcon').innerHTML=icons.note;$('apptInputIcon').innerHTML=icons.appt;$('clockIcon').innerHTML=icons.clock;renderQuickChips();if(currentType)setModalIdentity();syncDateDisplays()}
function renderQuickChips(){const a=lang==='de'?['1 Tablette','2 Tabletten','1 Spritze','Tropfen']:['1 tablet','2 tablets','1 injection','Drops'];const c=lang==='de'?['10 Min','20 Min','Kühlen','Gehen','Verband']:['10 min','20 min','Cooling','Walking','Dressing'];$('medDoseChips').innerHTML=a.map(v=>`<button type="button" class="quickChip" data-v="${esc(v)}">${esc(v)}</button>`).join('');$('careRoutineChips').innerHTML=c.map(v=>`<button type="button" class="quickChip" data-v="${esc(v)}">${esc(v)}</button>`).join('');$('medDoseChips').querySelectorAll('.quickChip').forEach(b=>b.onclick=()=>{$('medDetail').value=b.dataset.v;b.parentNode.querySelectorAll('.quickChip').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('careRoutineChips').querySelectorAll('.quickChip').forEach(b=>b.onclick=()=>{$('careDetail').value=b.dataset.v;b.parentNode.querySelectorAll('.quickChip').forEach(x=>x.classList.remove('active'));b.classList.add('active')})}
function render(){applyLang();if(!user){$('shell').classList.add('hidden');if(!welcomePassed){$('welcomeScreen').classList.remove('hidden');$('setupScreen').classList.add('hidden')}else{$('welcomeScreen').classList.add('hidden');$('setupScreen').classList.remove('hidden');if(!$('pdate').value)$('pdate').value=todayISO();syncDateDisplays()}return}$('welcomeScreen').classList.add('hidden');$('setupScreen').classList.add('hidden');$('shell').classList.remove('hidden');if(!['today','meds','care','red'].includes(page))page='today';const d=new Date(dayDate()+'T12:00:00');$('dateText').textContent=d.toLocaleDateString(lang==='de'?'de-DE':'en-US',{weekday:'long',month:'short',day:'numeric'});document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('active',b.dataset.day===selectedDay));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['today','meds','care','red'].forEach(p=>$(p+'Page').classList.toggle('hidden',p!==page));$('addBtn').style.display=['today','meds','care'].includes(page)?'block':'none';renderTimeline();renderLists();renderProfile();renderProgress();syncDateDisplays()}
function renderProgress(){const all=state.items.filter(i=>i.date===dayDate()),done=all.filter(i=>i.done).length,total=all.length,pct=total?Math.round(done/total*100):0;$('progressRing').style.setProperty('--p',pct);$('progressPct').textContent=pct+'%';$('progressBar').style.width=pct+'%';$('progressLabel').textContent=t('progress').replace('{done}',done).replace('{total}',total).replace('{pct}',pct);$('progressMessage').textContent=total?t('progressMsg'):(lang==='de'?'Heute ist noch nichts geplant.':'Nothing scheduled yet today.');$('successBanner').textContent=t('allDone');$('successBanner').classList.toggle('show',total>0&&done===total);$('progressCard').style.display=selectedDay==='today'&&page==='today'?'block':'none'}
function nodeIcon(type){return icons[type]||icons.care}function rowHTML(i){return `<div class="trow ${i.type} ${i.done?'done':''}" data-id="${i.id}"><div class="time">${fmtTime(i.time)}</div><div class="rail"></div><div class="eventCard"><div class="cardIcon">${nodeIcon(i.type)}</div><div><div class="title">${esc(i.name)}</div>${detailFor(i)?`<div class="sub">${esc(detailFor(i))}</div>`:''}</div><div class="actionZone"><button class="mini edit">${svgEdit}</button><button class="mini delete">${svgDelete}</button><button class="doneBtn ${i.done?'on':''}">${svgCheck}</button></div></div></div>`}function renderTimeline(){const all=state.items.filter(i=>i.date===dayDate()).sort((a,b)=>a.time.localeCompare(b.time)),open=all.filter(i=>!i.done),done=all.filter(i=>i.done);$('todayEmpty').classList.toggle('hidden',all.length>0);$('timeline').innerHTML=open.map(rowHTML).join('');$('completedTitle').classList.toggle('hidden',done.length===0);$('completed').innerHTML=done.map(rowHTML).join('');wireRows()}function wireRows(){document.querySelectorAll('.trow').forEach(r=>{const id=r.dataset.id;r.querySelector('.edit').onclick=()=>openEdit(id);r.querySelector('.delete').onclick=()=>del(id);r.querySelector('.doneBtn').onclick=e=>toggleDone(id,e.currentTarget)})}function listHTML(i){return `<div class="listItem ${i.type}" data-id="${i.id}"><div class="badge">${nodeIcon(i.type)}</div><div><div class="listTitle">${esc(i.name)}</div><div class="listMeta">${fmtTime(i.time)}${detailFor(i)?' • '+esc(detailFor(i)):''}</div></div><div class="actionZone"><button class="mini edit">${svgEdit}</button><button class="mini delete">${svgDelete}</button></div></div>`}function renderLists(){const a=state.items.filter(i=>i.type==='med'),b=state.items.filter(i=>i.type!=='med');$('medList').innerHTML=a.map(listHTML).join('');$('careList').innerHTML=b.map(listHTML).join('');$('medEmpty').classList.toggle('hidden',a.length>0);$('careEmpty').classList.toggle('hidden',b.length>0);document.querySelectorAll(' function renderProfile(){if(!user)return;$('meName').textContent=user.name;$('meProcedure').textContent=t(user.procedure)||user.procedure;$('meDate').textContent=formatDateForDisplay(user.procedureDate)}function showToast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>e.classList.remove('show'),3000)}function toggleDone(id,btn){const i=state.items.find(x=>x.id===id);if(!i)return;const on=!i.done;if(on){btn.classList.add('pop');if(navigator.vibrate)navigator.vibrate(18);setTimeout(()=>{i.done=true;save();showToast(t('toastDone'));render()},160)}else{i.done=false;save();render()}}function del(id){if(confirm(t('deleteConfirm'))){state.items=state.items.filter(x=>x.id!==id);save();render()}}

function openEdit(id){const i=state.items.find(x=>x.id===id);if(!i)return;mode='edit';editId=id;resetForm();selectType(i.type);$('itemDate').value=i.date;$('itemTime').value=i.time;if(i.type==='med'){$('medName').value=i.name;$('medDetail').value=i.detail||''}else if(i.type==='care'){$('careName').value=i.name;$('careDetail').value=i.detail||''}else{$('apptName').value=i.name;$('apptLocation').value=i.location||'';$('apptPrep').value=i.prep||''}syncDateDisplays();openModal()}function readForm(){const time=$('itemTime').value,date=$('itemDate').value;if(!time||!date)return null;if(currentType==='med')return{type:'med',name:$('medName').value.trim(),detail:$('medDetail').value.trim(),time,date};if(currentType==='care')return{type:'care',name:$('careName').value.trim(),detail:$('careDetail').value.trim(),time,date};return{type:'appt',name:$('apptName').value.trim(),location:$('apptLocation').value.trim(),prep:$('apptPrep').value.trim(),time,date}}function persist(closeAfter){const data=readForm();if(!data||!data.name){alert(t('formError'));return}if(mode==='edit'){const idx=state.items.findIndex(x=>x.id===editId);state.items[idx]={...state.items[idx],...data}}else state.items.push({id:uid(),done:false,...data});save();render();if(closeAfter)closeModal();else{const ty=currentType;resetForm();selectType(ty)}}
