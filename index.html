function render(){applyLang();if(!user){$('shell').classList.add('hidden');if(!welcomePassed){$('welcomeScreen').classList.remove('hidden');$('setupScreen').classList.add('hidden')}else{$('welcomeScreen').classList.add('hidden');$('setupScreen').classList.remove('hidden');if(!$('pdate').value)$('pdate').value=todayISO();syncDateDisplays()}return}$('welcomeScreen').classList.add('hidden');$('setupScreen').classList.add('hidden');$('shell').classList.remove('hidden');const d=new Date(dayDate()+'T12:00:00');$('dateText').textContent=d.toLocaleDateString(lang==='de'?'de-DE':'en-US',{weekday:'long',month:'short',day:'numeric'});document.querySelectorAll('.toggle button').forEach(b=>b.classList.toggle('active',b.dataset.day===selectedDay));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['today','meds','care','red','me'].forEach(p=>$(p+'Page').classList.toggle('hidden',p!==page));$('addBtn').style.display=['today','meds','care'].includes(page)?'block':'none';renderTimeline();renderLists();renderProfile();syncDateDisplays()}
function nodeIcon(type){return icons[type]||icons.care}function rowHTML(i){return `<div class="trow ${i.type} ${i.done?'done':''}" data-id="${i.id}"><div class="time">${fmtTime(i.time)}</div><div class="rail"><div class="node">${nodeIcon(i.type)}</div></div><div class="eventCard"><div><div class="title">${esc(i.name)}</div>${detailFor(i)?`<div class="sub">${esc(detailFor(i))}</div>`:''}</div><div class="actionZone"><button class="mini edit">${svgEdit}</button><button class="mini delete">${svgDelete}</button><button class="doneBtn ${i.done?'on':''}">${svgCheck}</button></div></div></div>`}function renderTimeline(){const all=state.items.filter(i=>i.date===dayDate()).sort((a,b)=>a.time.localeCompare(b.time)),open=all.filter(i=>!i.done),done=all.filter(i=>i.done);$('todayEmpty').classList.toggle('hidden',all.length>0);$('timeline').innerHTML=open.map(rowHTML).join('');$('completedTitle').classList.toggle('hidden',done.length===0);$('completed').innerHTML=done.map(rowHTML).join('');wireRows()}function wireRows(){document.querySelectorAll('.trow').forEach(r=>{const id=r.dataset.id;r.querySelector('.edit').onclick=()=>openEdit(id);r.querySelector('.delete').onclick=()=>del(id);r.querySelector('.doneBtn').onclick=()=>toggleDone(id)})}function listHTML(i){return `<div class="listItem ${i.type}" data-id="${i.id}"><div class="badge">${nodeIcon(i.type)}</div><div><div class="listTitle">${esc(i.name)}</div><div class="listMeta">${fmtTime(i.time)}${detailFor(i)?' • '+esc(detailFor(i)):''}</div></div><div class="actionZone"><button class="mini edit">${svgEdit}</button><button class="mini delete">${svgDelete}</button></div></div>`}function renderLists(){const medsList=state.items.filter(i=>i.type==='med'),careList=state.items.filter(i=>i.type!=='med');$('medList').innerHTML=medsList.map(listHTML).join('');$('careList').innerHTML=careList.map(listHTML).join('');$('medEmpty').classList.toggle('hidden',medsList.length>0);$('careEmpty').classList.toggle('hidden',careList.length>0);document.querySelectorAll('.listItem').forEach(r=>{const id=r.dataset.id;r.querySelector('.edit').onclick=()=>openEdit(id);r.querySelector('.delete').onclick=()=>del(id)})}function renderProfile(){if(!user)return;$('meName').textContent=user.name;$('meProcedure').textContent=t(user.procedure)||user.procedure;$('meDate').textContent=formatDateForDisplay(user.procedureDate)||'—'}function toggleDone(id){const i=state.items.find(x=>x.id===id);if(i){i.done=!i.done;save();render()}}function del(id){if(confirm(t('deleteConfirm'))){state.items=state.items.filter(x=>x.id!==id);save();render()}}function openModal(){$('itemModal').classList.add('open');document.body.classList.add('lock')}function closeModal(){$('itemModal').classList.remove('open');document.body.classList.remove('lock')}
function resetForm(){['medName','medDetail','careName','careDetail','apptName','apptLocation','apptPrep'].forEach(id=>$(id).value='');$('itemTime').value='';$('itemDate').value=dayDate();document.querySelectorAll('.timeChip').forEach(b=>b.classList.remove('active'));$('suggestions').classList.add('hidden');syncDateDisplays()}function openAdd(){mode='add';editId=null;currentType=null;resetForm();$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('choiceHead').classList.remove('hidden');$('formHead').classList.add('hidden');$('sheetTitle').textContent=t('whatAdd');openModal()}function selectType(v){currentType=v;$('typeStep').classList.add('hidden');$('itemForm').classList.remove('hidden');$('itemActions').classList.remove('hidden');$('choiceHead').classList.add('hidden');$('formHead').classList.remove('hidden');$('formTitle').textContent=v==='med'?t(mode==='edit'?'editMed':'addMed'):v==='care'?t(mode==='edit'?'editCare':'addCare'):t(mode==='edit'?'editAppt':'addAppt');['med','care','appt'].forEach(x=>$(x+'Fields').classList.toggle('hidden',x!==v));syncDateDisplays()}function openEdit(id){const i=state.items.find(x=>x.id===id);if(!i)return;mode='edit';editId=id;resetForm();selectType(i.type);$('itemDate').value=i.date;$('itemTime').value=i.time;if(i.type==='med'){$('medName').value=i.name;$('medDetail').value=i.detail||''}else if(i.type==='care'){$('careName').value=i.name;$('careDetail').value=i.detail||''}else{$('apptName').value=i.name;$('apptLocation').value=i.location||'';$('apptPrep').value=i.prep||''}syncDateDisplays();openModal()}function readForm(){const time=$('itemTime').value,date=$('itemDate').value;if(!time||!date)return null;if(currentType==='med')return{type:'med',name:$('medName').value.trim(),detail:$('medDetail').value.trim(),time,date};if(currentType==='care')return{type:'care',name:$('careName').value.trim(),detail:$('careDetail').value.trim(),time,date};return{type:'appt',name:$('apptName').value.trim(),location:$('apptLocation').value.trim(),prep:$('apptPrep').value.trim(),time,date}}function persist(closeAfter){const data=readForm();if(!data||!data.name){alert(t('formError'));return}if(mode==='edit'){const idx=state.items.findIndex(x=>x.id===editId);state.items[idx]={...state.items[idx],...data}}else state.items.push({id:uid(),done:false,...data});save();render();if(closeAfter)closeModal();else{const ty=currentType;resetForm();selectType(ty)}}
$('getStarted').onclick=()=>{welcomePassed=true;render()};document.querySelectorAll('.langBtn').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(LANG_KEY,lang);render()});document.querySelectorAll('.proc').forEach(b=>b.onclick=()=>{selectedProc=b.dataset.proc;document.querySelectorAll('.proc').forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-checked',String(on))})});$('setupForm').onsubmit=e=>{e.preventDefault();user={name:$('pname').value.trim(),procedure:selectedProc,procedureDate:$('pdate').value,phone:$('pphone').value.trim()};localStorage.setItem(USER_KEY,JSON.stringify(user));state=defaultState();save();render()};document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{selectedDay=b.dataset.day;render()});document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('addBtn').onclick=openAdd;document.querySelectorAll('[data-close="item"]').forEach(x=>x.onclick=closeModal);document.querySelectorAll('.typeTile').forEach(b=>b.onclick=()=>selectType(b.dataset.type));$('backBtn').onclick=()=>{currentType=null;$('typeStep').classList.remove('hidden');$('itemForm').classList.add('hidden');$('itemActions').classList.add('hidden');$('choiceHead').classList.remove('hidden');$('formHead').classList.add('hidden')};document.querySelectorAll('.timeChip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.timeChip').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('itemTime').value=b.dataset.time});$('itemTime').oninput=()=>document.querySelectorAll('.timeChip').forEach(x=>x.classList.toggle('active',x.dataset.time===$('itemTime').value));$('medName').onfocus=()=>$('medName').dispatchEvent(new Event('input'));$('medName').oninput=()=>{const q=$('medName').value.trim().toLowerCase(),matches=meds.filter(m=>!q||m.name.toLowerCase().includes(q)).slice(0,7);$('suggestions').classList.toggle('hidden',!matches.length);$('suggestions').innerHTML=matches.map((m,i)=>`<button type="button" class="suggestion" data-i="${i}"><strong>${esc(m.name)}</strong><span>${lang==='de'?'Aus Katalog übernehmen':'Use from catalog'}</span></button>`).join('');$('suggestions').querySelectorAll('.suggestion').forEach((b,i)=>b.onclick=()=>{$('medName').value=matches[i].name;$('suggestions').classList.add('hidden')})};$('saveAnother').onclick=e=>{e.preventDefault();persist(false)};$('doneSave').onclick=e=>{e.preventDefault();persist(true)};['pdate','itemDate','editDate'].forEach(id=>{$(id).addEventListener('input',syncDateDisplays);$(id).addEventListener('change',syncDateDisplays)});$('editProfileBtn').onclick=()=>{$('profileForm').classList.toggle('hidden');$('editName').value=user.name;$('editDate').value=user.procedureDate||'';syncDateDisplays()};$('cancelProfile').onclick=()=>$('profileForm').classList.add('hidden');$('saveProfile').onclick=()=>{user.name=$('editName').value.trim()||user.name;user.procedureDate=$('editDate').value||user.procedureDate;localStorage.setItem(USER_KEY,JSON.stringify(user));$('profileForm').classList.add('hidden');render()};$('resetBtn').onclick=()=>{if(confirm(t('reset')+'?')){localStorage.removeItem(USER_KEY);localStorage.removeItem(STATE_KEY);user=null;state=null;welcomePassed=false;render()}};if(!state&&user){state=defaultState();save()}render();
</script>
</body>
